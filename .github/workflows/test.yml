name: Tests

# omle-server is the top of the stack: it compiles omle-runtime as a CMake
# subproject, and omle-runtime in turn reads omle.proto out of the `omle`
# repository. So every build job checks out all three as siblings —
# CMakeLists.txt resolves OMLE_RUNTIME_DIR as ../omle-runtime, and the Python
# integration tests resolve their fixture models relative to the same layout
# (python/tests/conftest.py walks four levels up to the workspace root).
#
# The C++ unit tests and the Python integration tests share one build: the
# configure step pulls in gRPC codegen, Drogon and the whole runtime, which is
# the expensive part, and splitting them into separate jobs would pay it twice.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ---------------------------------------------------------------------------
  # Style — runs .pre-commit-config.yaml, the same file the local git hook runs,
  # so the two cannot drift. Seconds, and it fails before the build has finished
  # installing a toolchain.
  # ---------------------------------------------------------------------------
  lint:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      # --show-diff-on-failure prints the patch the autofixing hooks would have
      # applied, so a red build hands back the fix rather than just a rule name.
      - run: pre-commit run --all-files --show-diff-on-failure

  # ---------------------------------------------------------------------------
  # Build, then the C++ unit tests and the Python REST/gRPC integration tests.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and macOS use system packages: apt and brew both supply
          # Drogon and gRPC, so these rows finish in minutes and exercise the
          # unbundled path a developer following the README takes.
          - os: ubuntu-latest
            bundled: "OFF"
          - os: macos-latest
            bundled: "OFF"
          # Windows has no apt or brew, but ConanCenter publishes prebuilt
          # msvc binaries for every dependency here — including OpenSSL — so
          # this row downloads them rather than compiling gRPC's submodule tree
          # (Abseil, protobuf, BoringSSL, re2, c-ares) from source. Conan's
          # CMakeDeps generator emits ordinary package config files, so this is
          # the same unbundled find_package path Linux and macOS take; nothing
          # in cmake/ is Conan-aware.
          - os: windows-latest
            bundled: "OFF"

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          path: omle-server
      - uses: actions/checkout@v4.2.2
        with:
          repository: openmle/omle-runtime
          path: omle-runtime
      # omle-runtime's CMakeLists generates omle.pb.cc from this repository's
      # schema, so it is needed even though nothing here is Python.
      - uses: actions/checkout@v4.2.2
        with:
          repository: openmle/omle
          path: omle

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      # Drogon, gRPC, protobuf and GTest are found with find_package and are not
      # vendored, so they have to exist before configure. simdjson and
      # nlohmann/json fall back to FetchContent when absent (see
      # cmake/deps.cmake), but installing them keeps the build off the network.
      #
      # jsoncpp, uuid and zlib are listed explicitly because DrogonConfig.cmake
      # calls find_dependency(... REQUIRED) on all three, and
      # --no-install-recommends means libdrogon-dev does not drag them in.
      # The long tail here is Drogon's, not ours. Ubuntu builds libdrogon-dev
      # with ORM support, so DrogonConfig.cmake calls find_dependency on
      # PostgreSQL, SQLite, MySQL, Boost, Hiredis and yaml-cpp — every one of
      # which must resolve before find_package(Drogon) reports success, even
      # though this server touches no database. They fail one at a time, and
      # each failure surfaces as a bare "Drogon not found".
      #
      # libmariadb-dev-compat is the non-obvious one: Drogon's FindMySQL wants
      # the mysql_config script, which default-libmysqlclient-dev does not ship.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libdrogon-dev libjsoncpp-dev uuid-dev zlib1g-dev \
            libpq-dev libsqlite3-dev libmariadb-dev libmariadb-dev-compat \
            libhiredis-dev libyaml-cpp-dev libboost-dev libbrotli-dev \
            libgrpc++-dev protobuf-compiler protobuf-compiler-grpc libprotobuf-dev \
            libgtest-dev \
            libsimdjson-dev nlohmann-json3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja drogon grpc protobuf googletest simdjson nlohmann-json

      # Conan supplies Drogon, gRPC, protobuf, OpenSSL, GTest, simdjson and
      # nlohmann/json as prebuilt msvc binaries. This also retires the previous
      # hunt for an MSVC OpenSSL on the runner: the bundled build needed one
      # because gRPC uses SSL_PROVIDER=package and trantor links it too, and
      # the runner's only other copy is Strawberry Perl's MinGW build, which
      # cannot be linked into MSVC objects.
      - name: Cache the Conan package cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('omle-server/conanfile.txt') }}

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        working-directory: omle-server
        shell: bash
        run: |
          pip install conan
          conan profile detect --force

          # cppstd and runtime are passed explicitly, not left to `profile
          # detect`, which picks cppstd=14 for msvc. ConanCenter's binaries are
          # built at cppstd=17 with the dynamic runtime, and a package_id that
          # misses them is not an error — Conan just builds from source, which
          # is the slow path this job exists to avoid.
          #
          # --build=never makes that failure loud instead: if a binary is ever
          # absent, this step fails in seconds naming the package, rather than
          # going green forty minutes later.
          conan install . \
            --output-folder=build/conan \
            --build=never \
            -s build_type=Release \
            -s compiler.cppstd=17 \
            -s compiler.runtime=dynamic

      # Caches the FetchContent downloads, which is what makes the bundled row
      # bearable: the cost there is cloning gRPC's submodules, not compiling
      # them. Keyed on bundled_deps.cmake, so bumping any pin in that file
      # invalidates it and nothing else does.
      - name: Cache fetched dependency sources
        if: matrix.bundled == 'ON'
        uses: actions/cache@v4
        with:
          path: omle-server/build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('omle-server/cmake/bundled_deps.cmake') }}

      - name: Configure
        working-directory: omle-server
        shell: bash
        # BUILD_SERVER_TESTS defaults OFF, so tests/ is not even added to the
        # build without this; a run that forgot it would look green having
        # compiled no test at all.
        run: |
          # No -G on Windows. CMake then defaults to the Visual Studio
          # generator and builds with MSVC, which is what omle-runtime's
          # Windows wheels and jar are built with. Forcing -G Ninja instead
          # picks up whatever compiler is first on PATH — on the runner image
          # that is MinGW GCC, giving a binary with a different C++ runtime
          # than every other Windows artifact in the project.
          #
          # Visual Studio is a multi-config generator, so the build and test
          # steps pass --config / --build-config rather than relying on
          # CMAKE_BUILD_TYPE.
          GEN="-G Ninja"
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            GEN=""
            # CMP0091 NEW is what lets the toolchain set the MSVC runtime
            # through CMAKE_MSVC_RUNTIME_LIBRARY; without it the flag is baked
            # into CMAKE_CXX_FLAGS instead and Conan's setting is ignored,
            # giving a runtime mismatch against the downloaded binaries.
            EXTRA="-DCMAKE_TOOLCHAIN_FILE=$PWD/build/conan/conan_toolchain.cmake"
            EXTRA="$EXTRA -DCMAKE_POLICY_DEFAULT_CMP0091=NEW"
          fi
          cmake -S . -B build $GEN $EXTRA \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SERVER_TESTS=ON \
            -DOMLE_SERVER_BUNDLE_DEPS=${{ matrix.bundled }}

      - name: Build
        working-directory: omle-server
        shell: bash
        # The default target, not just omle_server: the test executables are
        # separate targets and `--target omle_server` would skip them.
        # --config is required by the Visual Studio generator and ignored by
        # Ninja, so one line serves both.
        run: cmake --build build --config Release -j 4

      - name: Assert the binary landed where the tests look for it
        working-directory: omle-server
        shell: bash
        # python/tests/conftest.py SKIPS when it cannot find the binary, so
        # without this check a build that produced nothing would report a green
        # run with every integration test silently skipped.
        run: |
          # Both layouts are checked because both occur: Ninja writes to
          # build/, while the Visual Studio generator is multi-config and
          # writes to build/Release/. conftest.py searches the same pair.
          #
          # if/fi rather than `[ ... ] && BIN=...`: the runner runs bash with
          # `set -e`, so a false test at the end of an && chain would exit
          # non-zero and fail this step on every non-Windows row.
          if [ "$RUNNER_OS" = "Windows" ]; then
            NAME=omle_server.exe
          else
            NAME=omle_server
          fi
          FOUND=""
          for c in "build/$NAME" "build/Release/$NAME"; do
            if [ -f "$c" ]; then FOUND="$c"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::no $NAME in build/ or build/Release/"
            exit 1
          fi
          echo "$FOUND present"

      - name: C++ unit tests
        working-directory: omle-server/build
        run: ctest --output-on-failure --build-config Release

      - name: Install the Python test dependencies
        working-directory: omle-server/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: REST and gRPC integration tests
        working-directory: omle-server/python
        # These start build/omle_server once per session and drive it over both
        # protocols, so they are the only check that the two OIP surfaces agree
        # with each other and with the runtime.
        run: pytest -q
